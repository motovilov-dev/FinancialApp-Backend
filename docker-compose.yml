services:
  finance-backend:
    container_name: finance-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # В проде PUBLIC_BASE_URL должен совпадать с доменом Traefik
      PUBLIC_BASE_URL: "https://finance-app-prod.motovilov-cloud.ru"
      # SQLite внутри контейнера должен лежать в writable-директории.
      # ВАЖНО: строка вида sqlite+aiosqlite:///./finance.db в практике часто резолвится в /finance.db
      # (root, read-only для непривилегированного пользователя) → "unable to open database file".
      DATABASE_URL: "sqlite+aiosqlite:////app/var/db/finance.db"
      # Убедимся, что контейнер пишет uploads внутрь volume
      # (в коде путь относительный: var/uploads)
    volumes:
      - finance_uploads:/app/var/uploads
      # если используете SQLite в контейнере (не рекомендуется для прод):
      - finance_db:/app/var/db
    networks:
      - traefik_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default

      # HTTPS router
      - traefik.http.routers.finance-backend.rule=Host(`finance-app-prod.motovilov-cloud.ru`)
      - traefik.http.routers.finance-backend.entrypoints=websecure
      - traefik.http.routers.finance-backend.tls=true
      - traefik.http.routers.finance-backend.tls.certresolver=letsencrypt

      # Сервис внутри контейнера (uvicorn слушает 8000)
      - traefik.http.services.finance-backend.loadbalancer.server.port=8000

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  finance_uploads:
  finance_db:

networks:
  traefik_default:
    external: true
    name: traefik_default

