[project]
name = "finance-backend"
version = "0.1.0"
description = "FinanceMac backend: FastAPI + SQLAlchemy 2 (async) + WebSockets"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.35",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "python-multipart==0.0.12",
    "aiosmtplib==3.0.2",
]

[dependency-groups]
dev = [
    "ruff==0.7.4",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() pattern
